<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Curio — a cabinet of curiosities</title>
<meta name="description" content="A personal feed of philosophy, history, psychology, and more — pulled live from Wikipedia, Wikiquote, and current research, on the topics you choose.">
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Curio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Curio <small>curiosities</small></div>
    <div style="display:flex; gap:8px;">
      <button id="installBtn" class="icon-btn" hidden aria-label="Install app" title="Install app">⇩</button>
      <button id="topicsBtn" class="icon-btn" aria-label="Choose topics" title="Choose topics">☰</button>
    </div>
  </header>

  <main id="feed" aria-live="polite"></main>

  <div id="emptyState" class="empty-state" hidden>
    <h2>Nothing selected yet</h2>
    <p>Pick a few subjects and cards will start pulling in from Wikipedia, Wikiquote, and current research.</p>
    <button id="emptyCta" class="btn-primary" type="button">Choose topics</button>
  </div>
</div>

<div id="drawer" aria-hidden="true">
  <div class="drawer-sheet" role="dialog" aria-label="Choose your topics">
    <div class="drawer-head">
      <h2>Your topics</h2>
      <button id="drawerClose" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-sub">Active subjects feed the mix below — tap any to toggle</div>
    <div id="topicList" class="topic-list"></div>
    <div class="add-topic">
      <input id="newTopicName" class="add-topic-input" type="text" placeholder="New topic (e.g. Astronomy)" maxlength="40">
      <input id="newTopicSeeds" class="add-topic-input" type="text" placeholder="Keywords, comma separated (optional)" maxlength="200">
      <button id="addTopicBtn" class="btn-ghost" type="button">+ Add topic</button>
    </div>
    <div class="drawer-actions">
      <button id="selectAll" class="btn-ghost" type="button">Select all</button>
      <button id="clearAll" class="btn-ghost" type="button">Clear all</button>
      <button id="drawerDone" class="btn-done" type="button">Done</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
